name: Feature request
description: Propose a focused product change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need and current limit.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the required behavior and scope.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: User value
      description: Explain the user benefit.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List existing tools or smaller changes that can solve the need.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: List observable conditions for completion.
